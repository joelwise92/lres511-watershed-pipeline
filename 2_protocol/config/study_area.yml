# Study area definition. Changing values here rebuilds the dataset for a new area.

study_area:
  name: "pilot"            # short label used in file names
  huc12: "100301030801"    # replace with the pilot watershed's 12-digit HUC12 ID

crs: 5070                  # EPSG code for all outputs (draft; see decision log)
resolution_m: 10           # target grid cell size in meters (draft; see decision log)

dates:
  start: "2000-01-01"      # earliest date for time-dependent layers
  end: "2025-12-31"        # latest date for time-dependent layers

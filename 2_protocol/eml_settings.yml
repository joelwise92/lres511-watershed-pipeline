# Settings for the EML metadata (4_product/eml.xml).
# Everything else in the metadata comes from the pipeline's own files.

title: "Harmonized public geospatial data for steep-terrain watershed research"

abstract: >
  Terrain, stream network, soil erodibility, rainfall intensity, forest canopy,
  disturbance history, and road layers for one watershed, assembled from public
  sources (USGS 3DEP and NHDPlus HR, the Watershed Boundary Dataset, NRCS SSURGO,
  NOAA Atlas 14, LANDFIRE canopy cover, canopy height, and Annual Disturbance, and
  USFS National Forest System roads) by a reproducible R pipeline.
  All layers share one coordinate reference system and grid, attributes are harmonized
  through a documented crosswalk, and every processing decision is recorded in the
  project's decision log.


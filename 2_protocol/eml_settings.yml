methods_overview: >
  Each layer is downloaded by script, saved unchanged with its source metadata, and
  logged with its source, version, and retrieval date. Layers are then reprojected to
  a common coordinate reference system, resampled to a common grid, masked to the
  watershed, and harmonized to consistent attribute names, units, and NoData values
  using a documented crosswalk. Raw downloads (where logged) and final files carry MD5
  checksums, and revisions are logged in 2_protocol/changelog.csv. Automated quality
  checks are reported in the rendered summary report. The steps below describe each
  layer.
  
